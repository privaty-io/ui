name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vitest browser mode runs the component specs in real Chromium.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build
