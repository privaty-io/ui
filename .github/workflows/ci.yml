name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vitest browser mode runs the component specs in real Chromium, and
      # the overlay specs additionally in Firefox (the browser that
      # motivated that layer).
      - run: pnpm exec playwright install chromium firefox --with-deps

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test --run

      # The e2e suite drives the playground like a user — SSR, hydration,
      # and real state flows, with a console guard failing on any page
      # error or hydration warning. CI=1 makes playwright manage the dev
      # server itself.
      - run: pnpm e2e
      - run: pnpm build
