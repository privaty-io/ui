name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC for npm trusted publishing (configured on each package at
      # npmjs.com: repo privaty-io/ui, workflow publish.yml). Provenance is
      # generated automatically on trusted publishes.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No registry-url: it would write an .npmrc auth line referencing a
      # NODE_AUTH_TOKEN env var that no longer exists — trusted publishing
      # needs no token at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lockstep guard: every packages/* manifest must match the tag.
      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in packages/*/package.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$manifest is $version but tag is $tag"
              exit 1
            fi
          done

      # vitest browser mode runs the component specs in real Chromium.
      - run: pnpm exec playwright install chromium firefox --with-deps

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build

      # pnpm rewrites workspace:^ peers to the lockstep version and applies
      # each package's publishConfig (exports -> dist). Private workspace
      # projects (playground, configs) are skipped automatically. Auth is
      # OIDC trusted publishing — no token. If pnpm's OIDC exchange ever
      # regresses (pnpm/pnpm#11513 was a pnpm 11 404), swap this step for
      # `pnpm -r pack` + `npm publish` of the tarballs — pack applies the
      # same publishConfig/workspace rewrites and the npm CLI does OIDC.
      - name: Publish to npm
        run: pnpm publish -r --access public --no-git-checks
